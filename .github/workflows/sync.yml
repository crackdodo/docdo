name: Sync from Netlify
on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 동기화
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Pages
        uses: actions/checkout@v4

      # 가장 에러 없는 검증된 다운로드 액션 플러그인 사용
      - name: Download Netlify Site Content
        uses: kakeis/netlify-download-action@v1
        with:
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          output-dir: '.' # 현재 폴더에 다운로드

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          # 변경사항이 있을 때만 푸시하여 오류 방지
          git diff-index --quiet HEAD || git commit -m "Sync latest deployment from Netlify"
          git push
