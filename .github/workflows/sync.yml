name: Sync from Netlify
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 에러 해결을 위해 깃허브 쓰기 권한 직접 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node 24를 강제로 허용하여 체크아웃 에러 방지
      - name: Checkout GitHub Pages
        uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Download Netlify Deploy Content
        run: |
          curl -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
               https://netlify.com{{ secrets.NETLIFY_SITE_ID }}/deploys > deploys.json
          DEPLOY_URL=$(jq -r '..deploy_ssl_url' deploys.json)
          wget -r -np -nH --cut-dirs=0 -P . $DEPLOY_URL
          rm deploys.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync latest deployment from Netlify"
          git push
