name: Sync from Netlify
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Pages
        uses: actions/checkout@v4
        env:
          # 2026년 깃허브 정책에 맞춰 자바스크립트 액션을 Node 24로 강제 구동
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Download Netlify Deploy Content
        run: |
          curl -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
               https://netlify.com{{ secrets.NETLIFY_SITE_ID }}/deploys > deploys.json
          DEPLOY_URL=$(jq -r '..deploy_ssl_url' deploys.json)
          wget -r -np -nH --cut-dirs=0 -P . $DEPLOY_URL
          rm deploys.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync latest deployment from Netlify"
          git push
